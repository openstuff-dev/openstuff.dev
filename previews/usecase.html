<!-- Drawn preview of usecase.openstuff.dev. var(--c) is the project's colour, taken from its icon. -->
<div class="mini-nav">
  {{mark}}
  <b>Open<span>Usecase</span></b>
  <span>Features</span><span>How it works</span><span>Self-host</span>
</div>
<div style="display: flex; gap: 22px; padding: 28px 24px 0; align-items: flex-start">
  <div style="flex: 1; min-width: 0">
    <p class="mini-h">Agents build what you agreed to.</p>
    <ol style="list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.7rem">
      <li style="display: flex; align-items: center; gap: 8px"><i style="width: 9px; height: 9px; border-radius: 50%; background: var(--c)"></i>Agent proposes <span style="margin-left: auto; color: var(--fg-ll); font-family: var(--mono)">UC-142</span></li>
      <li style="display: flex; align-items: center; gap: 8px"><i style="width: 9px; height: 9px; border-radius: 50%; background: var(--c)"></i>You approve <span style="margin-left: auto; color: var(--fg-ll); font-family: var(--mono)">inbox</span></li>
      <li style="display: flex; align-items: center; gap: 8px"><i style="width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--c)"></i><b style="font-weight: 600">Tests prove it</b> <span style="margin-left: auto; color: var(--fg-ll); font-family: var(--mono)">passing</span></li>
    </ol>
  </div>
  <div class="mini-card" style="flex: 0 0 34%; box-shadow: var(--os-shadow-md); transform: rotate(2deg)">
    <small style="font-family: var(--mono)">UC-142/S2</small>
    <p style="margin: 6px 0 10px; font-size: 0.72rem; line-height: 1.35">Reject an invalid colour</p>
    <p style="display: flex; gap: 6px; margin: 0">
      <span style="padding: 3px 8px; border-radius: 5px; background: var(--c); color: #fff; font-size: 0.65rem; font-weight: 600">Approve</span>
      <span style="padding: 3px 8px; border-radius: 5px; border: 1px solid var(--fg-ll); font-size: 0.65rem">Changes</span>
    </p>
  </div>
</div>
