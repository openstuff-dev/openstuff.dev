<!-- Drawn preview of design.openstuff.dev. var(--c) is the project's colour, taken from its icon. -->
<div style="display: flex; height: 100%">
  <div style="flex: 0 0 24%; padding: 16px 14px; border-right: 1px solid var(--bd); background: var(--bg-alt); font-size: 0.7rem; color: var(--fg-l); display: flex; flex-direction: column; gap: 9px">
    <b style="display: flex; align-items: center; gap: 6px; color: var(--fg); font-size: 0.8rem; font-weight: 500; margin-bottom: 6px">{{mark}}Design</b>
    <span style="color: var(--fg); font-weight: 500">Tokens</span><span>Buttons</span><span>Fields</span><span>Dialogs</span><span>Tables</span><span>Marketing</span>
  </div>
  <div style="flex: 1; min-width: 0; padding: 22px 24px">
    <p class="mini-h" style="font-size: 1.6rem">Themed from one colour.</p>
    <p style="margin-top: 6px; font: 0.68rem/1.4 var(--mono); color: var(--fg-ll)">primaryColor: #2d5bff</p>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin-top: 16px">
      <i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.53 0.16 265.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.54 0.16 310.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.54 0.16 355.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.54 0.16 40.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.525 0.107 85.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.515 0.14 130.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.515 0.096 175.9)"></i><i style="aspect-ratio: 1; border-radius: 4px; background: oklch(0.52 0.095 220.9)"></i>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; font-size: 0.68rem">
      <span style="padding: 6px 10px; border-radius: 5px; background: #2d5bff; color: #fff">Primary</span>
      <span style="padding: 6px 10px; border-radius: 5px; border: 1px solid var(--bd); background: var(--s1)">Default</span>
      <span style="padding: 6px 10px; border-radius: 5px; color: var(--fg-l)">Ghost</span>
      <span style="padding: 6px 10px; border-radius: 5px; background: oklch(0.59 0.19 25); color: #fff">Danger</span>
    </div>
    <div style="margin-top: 14px; padding: 9px 11px; border: 1px solid var(--bd); border-radius: 6px; background: var(--s1); font: 0.64rem/1.5 var(--mono); color: var(--fg-l)">--os-brand-default · --os-bg-surface-100 · --os-radius-md</div>
  </div>
</div>
